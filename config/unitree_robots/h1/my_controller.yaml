locomotion_mode: standing  # walking or standing

timing:
  cycle: 1.0
  swing: 0.4
  stance: 0.6
  horizon: 0.5
  horizon_steps: 20

model:
  xml_path: models/unitree_robots/h1/scene.xml
  auxiliary_xml_path: models/unitree_robots/h1/h1.xml
  gravity: -9.81

mpc:
  friction_coefficient: 0.6
  foot_half_length: 0.09
  foot_half_width: 0.04
  torsional_friction_scale: 0.08
  normal_force_max: 1000.0
  normal_force_min: 5.0
  iterations_between_solve: 10
  contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
  #                    roll   theta  psi  px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
  state_weight_diag: [10000.0, 500.0, 100.0, 2000.0, 10700.0, 900.0, 2600.0, 100.0, 1.0, 500.0, 550.0, 10.0, 1.0]
  input_weight_diag: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4]

swing:
  natural_frequency: [600.0, 600.0, 500.0]
  kd_diag: [25.0, 25.0, 10.0]
  height: 0.06
  min_remaining_time: 0.001
  touchdown_target_mode: body_velocity_half_stance
  foot_end_effector_source: site  # Uses the foot bottom-center contact sites in h1.xml.

foot_placement:
  velocity_feedback_gain: 0.03
  placement_clamp: 0.2
  touchdown_height: -0.005
  nominal_lateral_offset: 0.0
  swing_bias: 0.0

logging:
  gait_status_interval: 50
  standing_mpc_debug_trigger_times: []

startup:
  # If locomotion_mode is walking, hold standing MPC this long after leg PD init before gait starts.
  post_init_standing_settle_time: 10.0

joint_tracking:
  leg:
    # H1 order: [hip_yaw, hip_roll, hip_pitch, knee, ankle]
    kp: [100.0, 100.0, 200.0, 200.0, 400.0]
    kd: [10.0, 10.0, 10.0, 10.0, 30.0]
  arm:
    # H1 order: [shoulder_pitch, shoulder_roll, shoulder_yaw, elbow]
    kp: [60.0, 60.0, 50.0, 45.0]
    kd: [4.0, 4.0, 3.0, 3.0]

initial_pose:
  # Floating-base pose placeholder from the scene keyframe.
  base_position_W: [0.0, 0.0, 0.941049]
  base_rpy_W: [0.0, 0.0, 0.0]
  leg_initialization_time: 2.0
  arm_initialization_time: 1.0
  # H1 order: [hip_yaw, hip_roll, hip_pitch, knee, ankle]
  leg_joint_offsets: [0.0, 0.0, -0.5, 0.9, -1.0]
  # H1 order: [shoulder_pitch, shoulder_roll, shoulder_yaw, elbow]
  arm_joint_offsets: [0.0, 0.0, 0.0, 0.0]

left_swing_hold_test:
  touchdown_target_mode: body_velocity_half_stance
