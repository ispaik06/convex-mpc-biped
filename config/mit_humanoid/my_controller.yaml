requested_locomotion_mode: interactive  # requested startup mode: walking / standing / interactive

timing:
  cycle: 0.5
  swing: 0.17
  stance: 0.33
  horizon: 0.5
  horizon_steps: 25

model:
  xml_path: models/mit_humanoid/scene.xml
  auxiliary_xml_path: models/mit_humanoid/mit_humanoid.xml
  foot_end_effector_source: site  # site or collision_geom_center
  gravity: -9.81

mpc:
  friction_coefficient: 1.0
  foot_half_length: 0.065
  foot_half_width: 0.01
  torsional_friction_scale: 0.0657
  normal_force_max: 1500.0
  normal_force_min: 5.0 # Could this cause MPC solve issues? Should this be 0 N instead?
  iterations_between_solve: 10
  walking:
    contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
    #                    roll   pitch  yaw    px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
    state_weight_diag: [50000,  8000,  500,   200000,  1009300,  100900,     10,     10,     10,     500,    70,    10,   1 ]
    #                    Fx_L    Fy_L    Fz_L    Fx_R    Fy_R    Fz_R    Mx_L    My_L    Mz_L    Mx_R    My_R    Mz_R
    input_weight_diag: [1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5]
  standing:
    contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
    # Keep the same baseline for now; tune this separately from walking later.
    #                    roll   pitch  yaw    px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
    state_weight_diag: [50000,  80000,   500,    50000,  90000,  50000,      10,     10,     10,     10,    10,    5,   1 ]
    #                    Fx_L    Fy_L    Fz_L    Fx_R    Fy_R    Fz_R    Mx_L    My_L    Mz_L    Mx_R    My_R    Mz_R
    input_weight_diag: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4]

swing:
  natural_frequency: [151.0, 151.0, 110.0]
  kd_diag: [25.0, 25.0, 25.0]
  height: 0.07
  min_remaining_time: 0.001
  body_velocity_half_stance_offset: 0.26
  swing_foot_yaw_lead_scale: 1.0
  enable_stance_foot_yaw_hold: true
  turn_tangential_lead_scale: 1.0
  nominal_foot_offsets_B:
    - [0.0, 0.075999602, 0.0] # [0.0, 0.075999602, 0.0]
    - [0.0, -0.075999602, 0.0]
  # Optional fixed override for the stop-braking offset added at touchdown.
  # Uncomment to replace the capture-point braking heuristic with a constant body-frame offset.
  # stop_braking_offset_B: [0.0, 0.0, 0.0]
  stop_capture_point_gain: 0.2
  stop_capture_point_max_offset: 0.08
  stop_velocity_deadband: 0.02
  stop_braking_latch_clear_ticks: 5
  # MIT humanoid is 5-DOF at the leg, so keep swing roll control disabled.
  roll_kp: 0.0
  roll_kd: 0.0
  pitch_kp: 300.0
  pitch_kd: 18.0
  yaw_kp: 305.0
  yaw_kd: 18.0
  stance_yaw_kp: 20.0
  stance_yaw_kd: 4.0

user_command_filter:
  x_dot_tau: 0.90
  y_dot_tau: 0.90
  psi_dot_tau: 0.70
  standing_roll_offset_tau: 0.70
  standing_pitch_offset_tau: 0.70
  x_dot_max: 0.55
  y_dot_max: 0.3
  psi_dot_max: 0.9

contact_manager:
  contact_force_on_threshold: 10.0
  contact_force_off_threshold: 0.5
  contact_on_confirm_ticks: 1
  contact_off_confirm_ticks: 4
  contact_ramp_duration: 0.03
  contact_lock_steps: 1
  late_contact_timeout: 0.20
  ground_search_velocity: 0.40
  ground_search_max_depth: 0.15
  ground_search_tracking_time: 0.08
  stance_contact_loss_foot_height: 0.060
  enable_early_contact_handling: true
  enable_late_contact_handling: true

logging:
  standing_mpc_debug_trigger_times: []

startup:
  # If requested_locomotion_mode is walking, hold standing MPC this long after leg PD init before gait starts.
  post_init_standing_settle_time: 1.0

locomotion_transition:
  # In interactive mode, walking -> standing first zeroes the motion command.
  # Stay in the low-speed settle phase until the body has been slow for this many ticks,
  # then wait for either this timeout or this many touchdown events.
  braking_settle_speed_threshold: 0.05
  braking_settle_hold_ticks: 3
  braking_timeout_seconds: 3.0
  braking_touchdown_count: 5

joint_tracking:
  leg:
    # MIT humanoid order: [hip_yaw, hip_abad, hip_pitch, knee, ankle]
    kp: [70.0, 50.0, 100.0, 100.0, 200.0]
    kd: [15.0, 10.0, 10.0, 10.0, 30.0]
  arm:
    # MIT humanoid order: [shoulder_pitch, shoulder_abad, shoulder_yaw, elbow]
    kp: [100.0, 100.0, 100.0, 100.0]
    kd: [5.0, 5.0, 5.0, 5.0]

initial_pose:
  # Floating-base pose from the scene keyframe. Used once to seed the reduced-body target.
  base_position_W: [0.0, 0.0, 0.679472]  # 0.625972 / 0.679472
  base_rpy_W: [0.0, 0.0, 0.0]
  leg_initialization_time: 2.0
  arm_initialization_time: 1.0
  leg_joint_offsets: [0, 0, -0.735, 1.2, -0.70]
  arm_joint_offsets: [0.0, 0.0, 0.0, -0.65]

gait_swing_hold_test:
  xml_path: models/mit_humanoid/scene_test.xml
  keyframe_name: copied_state
